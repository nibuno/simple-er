<svg xmlns="http://www.w3.org/2000/svg" width="1387" height="604" viewBox="-90.76457883369326 2 1387 604"><title>レビュー用・非同期通知</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#84998e" stroke-width="1.5"/></marker></defs><rect x="-90.76457883369326" y="2" width="1387" height="604" fill="#f8faf9"/><g font-family="system-ui,-apple-system,BlinkMacSystemFont,Noto Sans JP,sans-serif"><rect x="-28" y="50" width="1276" height="266" rx="10" fill="#f0f4f2" stroke="#c3d1c9"/><text x="-10" y="78" fill="#68766f" font-size="13" font-weight="500">非同期通知</text><path d="M 864 156.5 L 902 156.5 Q 912 156.5 912 166.5 L 912 184 Q 912 194 922 194 L 936 194" fill="none" stroke="#cbd7d0" stroke-width="1" stroke-dasharray="3 5"/><path d="M 204 154 L 334 154" fill="none" stroke="#84998e" stroke-width="1.7" marker-end="url(#arrow)"/><text x="269" y="147" text-anchor="middle" font-size="12" fill="#52685c" stroke="#f8faf9" stroke-width="5" paint-order="stroke" stroke-linejoin="round">注文確定イベント</text><path d="M 534 154 L 638.75 154 Q 640 154 640 155.25 L 640 155.25 Q 640 156.5 641.25 156.5 L 664 156.5" fill="none" stroke="#84998e" stroke-width="1.7" marker-end="url(#arrow)"/><text x="599" y="147" text-anchor="middle" font-size="12" fill="#52685c" stroke="#f8faf9" stroke-width="5" paint-order="stroke" stroke-linejoin="round">最大10件を取得</text><rect x="4" y="104" width="200" height="100" rx="8" fill="#ffffff" stroke="#cbd7d0"/><text x="20" y="136" fill="#263b35" font-size="16" font-weight="600">API</text><text x="20" y="164" fill="#68766f" font-size="13" font-weight="400">注文受付 → 202 を返す</text><rect x="334" y="104" width="200" height="100" rx="8" fill="#ffffff" stroke="#cbd7d0"/><text x="350" y="136" fill="#263b35" font-size="16" font-weight="600">Queue</text><text x="350" y="164" fill="#68766f" font-size="13" font-weight="400">通知イベントをためる</text><rect x="664" y="104" width="200" height="105" rx="8" fill="#ffffff" stroke="#cbd7d0"/><text x="680" y="136" fill="#263b35" font-size="16" font-weight="600">Worker</text><text x="680" y="164" fill="#68766f" font-size="13" font-weight="400">メール送信・失敗時は再試</text><text x="680" y="185" fill="#68766f" font-size="13" font-weight="400">行</text><path d="M -42.764578833693264 333.69330453563714 V 557.6933045356371" stroke="#b9cbc0" stroke-width="2"/><text x="-28.764578833693264" y="355.69330453563714" fill="#68766f" font-size="13" font-weight="500">方針と懸念</text><text x="-28.764578833693264" y="387.69330453563714" fill="#263b35" font-size="14" font-weight="400">方針：メール送信は非同期にする。</text><text x="-28.764578833693264" y="411.69330453563714" fill="#263b35" font-size="14" font-weight="400">API は通知完了を待たずに応答する。</text><text x="-28.764578833693264" y="435.69330453563714" fill="#263b35" font-size="14" font-weight="400"></text><text x="-28.764578833693264" y="459.69330453563714" fill="#263b35" font-size="14" font-weight="400">懸念：重複配信をどう防ぐか。</text><text x="-28.764578833693264" y="483.69330453563714" fill="#263b35" font-size="14" font-weight="400">再試行は3回まで、失敗時はDLQへ。</text><text x="-28.764578833693264" y="507.69330453563714" fill="#263b35" font-size="14" font-weight="400">確認：監視と手動再実行の担当を決める</text><text x="-28.764578833693264" y="531.6933045356371" fill="#263b35" font-size="14" font-weight="400">。</text><path d="M 936 104 V 284" stroke="#b9cbc0" stroke-width="2"/><text x="950" y="126" fill="#68766f" font-size="13" font-weight="500">Worker のメモ</text><text x="950" y="158" fill="#263b35" font-size="14" font-weight="400">冪等性キーは注文IDを使う。</text><text x="950" y="182" fill="#263b35" font-size="14" font-weight="400">再試行は3回まで。</text><text x="950" y="206" fill="#263b35" font-size="14" font-weight="400">送信成功後にメッセージを削除する。</text></g></svg>